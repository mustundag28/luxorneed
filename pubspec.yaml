name: luxorneed
description: A new Flutter project by mustundag28.

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Yardımcılar
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  uuid: ^4.3.3

  # Yerel Veri Tabanı (Local DB)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Grafik Paketi
  fl_chart: ^0.66.0

  # Yerel Bildirim Paketi & Saat Dilimi Desteği
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # App Icon Oluşturucu Paket
  flutter_launcher_icons: ^0.13.1

  # Hive için Kod Üretici Paketler
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

# İkon Konfigürasyonu (pubspec.yaml dosyasının en altına ekleyin)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21 # adaptive icon desteği için